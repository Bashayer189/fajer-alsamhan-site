<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="أ. فجر السمحان، مدرب مدربين دولي ومدرب إتيكيت معتمد. دورات التدريب والتأثير الفعّال والإتيكيت. للتسجيل: 96951560">
<title>FAJER ALSAMHAN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style id="site-css">
/* Layout: portrait hero beside the name, titled bands of course cards, a course sheet that walks details → terms → WhatsApp, and an owner-only admin drawer */
:root{
  --bg:#d3cec5; --surface:#f1eee8; --fg:#30312f; --muted:#5f5f5a; --line:#b9b4ab;
  --accent:#666661; --ink:#30312f; --on-ink:#f1eee8; --stone:#a5a29b; --ok:#3f6b4a; --warn:#8a4b2f;
  --display:"El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.8}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
header{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--latin);font-weight:600;letter-spacing:.22em;font-size:1.05rem;direction:ltr;text-decoration:none}
nav{display:flex;gap:2px 18px;flex-wrap:wrap;font-size:.9rem;align-items:center}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--fg)}
.admin-btn{font:inherit;font-size:.85rem;background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:4px 14px;cursor:pointer}

.hero{padding-block:56px;display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:center}
.hero-text{display:grid;gap:16px;min-width:0}
.kicker{color:var(--accent);font-weight:600;font-size:.95rem;margin:0}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.2;margin:0}
.latin{font-family:var(--latin);direction:ltr;text-align:right;letter-spacing:.32em;color:var(--muted);font-size:1rem;margin:0}
.motto{font-family:var(--display);font-size:1.15rem;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;padding:10px 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem;border:1px solid var(--fg);font-family:var(--body);cursor:pointer;background:none;color:var(--fg);line-height:1.5}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none}
.btn.small{padding:6px 14px;font-size:.85rem}
.portrait{margin:0;max-width:100%;aspect-ratio:2/3;border-radius:150px 150px 14px 14px;overflow:hidden;background:var(--surface)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}

section{padding-block:56px;border-top:1px solid var(--line)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3.5vw,2.1rem);margin:0;text-wrap:balance}
.head small{color:var(--accent);font-family:var(--latin);letter-spacing:.2em;font-size:.85rem;direction:ltr}
.cv{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 32px}
.cv li{padding-block:14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline}
.cv b{font-family:var(--latin);font-size:1.6rem;color:var(--accent);font-weight:600;min-width:2.4ch;font-variant-numeric:tabular-nums}
.cv .dot{width:8px;height:8px;border-radius:50%;background:var(--stone);margin-inline:10px;align-self:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:start;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{border-color:var(--fg);transform:translateY(-2px)}
.card h3{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0}
.card .en{font-family:var(--latin);direction:ltr;text-align:right;color:var(--muted);font-size:1rem;margin:0}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.price small{font-weight:400;color:var(--muted);font-size:.8rem}
.more{font-weight:600;font-size:.92rem;text-decoration:underline;text-underline-offset:4px}
.empty-cat{color:var(--muted)}
.soon{border:1px dashed var(--line);background:var(--surface);border-radius:14px;padding:28px;color:var(--muted);text-align:center}
.soon strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.2rem;font-weight:500}

.register{background:var(--ink);color:var(--on-ink);border-top:0}
.register .inner{display:grid;gap:12px;justify-items:start}
.register h2{color:var(--on-ink)}
.phone{font-family:var(--latin);font-size:clamp(2.4rem,7vw,3.4rem);font-weight:600;letter-spacing:.06em;direction:ltr;line-height:1.1;user-select:all}
.register p{margin:0;opacity:.85}
.register .btn{border-color:var(--on-ink);color:var(--on-ink)}
.register .btn.primary{background:var(--on-ink);color:var(--ink)}
footer{padding-block:28px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.filter{border-top:1px solid var(--line);padding-block:20px}
.filter .wrap{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.filter span.lbl{font-family:var(--display);font-weight:500;font-size:1.1rem;margin-inline-end:4px}
.chip{font:inherit;font-size:.92rem;border:1px solid var(--fg);background:none;color:var(--fg);border-radius:999px;padding:5px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.badge{align-self:flex-start;font-size:.78rem;font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 10px;line-height:1.7}
/* course sheet */
.overlay{position:fixed;inset:0;background:rgba(48,49,47,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:100%;overflow:auto;border-radius:20px 20px 0 0;padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}
@media (min-width:720px){.overlay{align-items:center;padding:24px}.sheet{border-radius:20px;max-height:calc(100% - 48px)}}
.sheet-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheet h3{font-family:var(--display);font-size:1.6rem;margin:0;line-height:1.3;text-wrap:balance}
.x{background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;color:var(--fg);flex:none;line-height:1}
.steps{display:flex;gap:6px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.steps span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0}
.facts div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts dt{font-size:.78rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.prose{white-space:pre-line;margin:0}
.terms{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px 16px;max-height:220px;overflow:auto;white-space:pre-line;font-size:.92rem}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;margin-top:5px;accent-color:var(--fg);flex:none}
.field{display:grid;gap:4px}
.field label{font-size:.88rem;font-weight:500}
.field input,.field textarea,.field select{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);width:100%}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.err{color:var(--warn);font-size:.85rem;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.done{text-align:center;display:grid;gap:10px;justify-items:center}
.done .mark{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.6rem}
.ref{font-family:var(--latin);direction:ltr;letter-spacing:.1em;font-size:1.2rem;font-weight:600}

/* admin */
.admin{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.admin-bar{position:sticky;top:0;background:var(--ink);color:var(--on-ink);z-index:2}
.admin-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px}
.admin-bar strong{font-family:var(--display);font-size:1.15rem}
.admin-bar .btn{border-color:var(--on-ink);color:var(--on-ink)}
.admin-bar .btn.primary{background:var(--on-ink);color:var(--ink)}
.status{font-size:.85rem;opacity:.85;min-height:1.4em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:18px 6px}
.tabs button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 16px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.panel{display:grid;gap:16px;padding-block:12px 48px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.box h4{margin:0;font-family:var(--display);font-size:1.15rem;font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.photo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photo-row img{width:96px;height:144px;object-fit:cover;border-radius:48px 48px 8px 8px;background:var(--bg)}
.course-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.course-row:last-child{border-bottom:0}
.course-row .t{min-width:0}
.course-row .t b{display:block;font-weight:600}
.course-row .t span{font-size:.85rem;color:var(--muted)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-inline-start:6px;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.list-edit{display:grid;gap:8px}
.list-edit .li{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center}
.list-edit .li.noval{grid-template-columns:1fr auto}
.list-edit input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);width:100%;min-width:0}
.del{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;color:var(--warn);font-size:1rem}
.confirm-del{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--warn)}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding-block:32px 40px;gap:28px}
  .portrait{max-width:240px;order:-1}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

function parsePasted(txt){
  var get=function(label){var m=txt.match(new RegExp(label+'\\s*[:：]\\s*(.+)'));return m?m[1].trim():'';};
  var set=function(id,v){var e=document.getElementById(id);if(e&&v)e.value=v;};
  set('cc-name',get('الاسم'));set('cc-mobile',get('رقم الهاتف'));set('cc-ref',get('رقم الطلب'));set('cc-note',get('ملاحظات'));
  var title=get('دورة');
  if(title){var c=S.courses.filter(function(x){return x.title===title;})[0]||S.courses.filter(function(x){return title.indexOf(x.title)>-1||x.title.indexOf(title)>-1;})[0];if(c)document.getElementById('cc-course').value=c.id;}
}
function confirmLink(){
  var g=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
  var c=findCourse(g('cc-course')), raw=g('cc-mobile'), m=raw.replace(/\D/g,''), a=document.getElementById('cc-send'), pv=document.getElementById('cc-preview');
  if(!a) return;
  if(m.length===8) m='965'+m;
  if(!c||m.length<8||!g('cc-name')){a.setAttribute('aria-disabled','true');a.href='#';if(pv)pv.textContent='املئي الاسم والرقم لتظهر الرسالة.';return;}
  var map={'الاسم':g('cc-name'),'الهاتف':raw,'الدورة':c.title,'النوع':typeName(c.type)||'-','الموعد':c.dates||'سيتم إبلاغك به','المدة':c.duration||'-','المكان':c.place||'سيتم إبلاغك به','السعر':fmtPrice(c),'رقم_الطلب':g('cc-ref')||'-','ملاحظات':g('cc-note')||'-'};
  var t=S.confirmTemplate.replace(/\{([^}]+)\}/g,function(all,k){return k in map?map[k]:all;});
  if(pv)pv.textContent=t;
  a.href='https://wa.me/'+m+'?text='+encodeURIComponent(t); a.setAttribute('aria-disabled','false');
}

function resizeImage(file,cb){
  var r=new FileReader();
  r.onload=function(){var img=new Image();img.onload=function(){
    var max=900,w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
    var cv=document.createElement('canvas');cv.width=Math.round(w*s);cv.height=Math.round(h*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',0.85));
  };img.onerror=function(){cb(null);};img.src=r.result;};
  r.readAsDataURL(file);
}

  if(!sb||!canEdit){ui.status='سجّلي الدخول أولاً.';render();return;}
  ui.status='جارٍ الحفظ…';render();
  sb.from('site_content').upsert({id:1,data:S,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error){ui.status=/row-level|permission|policy/i.test(r.error.message)?'هذا الإيميل غير مسموح له بالتعديل.':'تعذّر الحفظ: '+r.error.message;}
    else{ui.dirty=false;ui.status='تم الحفظ، التعديلات ظاهرة للزوار الآن';}
    render();
  });
}
function checkAdmin(){
  if(!sb) return Promise.resolve(false);
  return sb.auth.getSession().then(function(r){
    if(!r.data||!r.data.session) return false;
    return sb.from('admins').select('email').limit(1).then(function(a){return !a.error&&a.data&&a.data.length>0;});
  });
}
function openLogin(){
  checkAdmin().then(function(ok){canEdit=ok;if(ok){ui.admin=true;ui.login=false;}else{ui.login=true;}render();
    setTimeout(function(){var f=document.getElementById('lg-email');if(f)f.focus();},0);});
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('button,a,[data-course]'); if(!t) return;
  if(t.matches('a[aria-disabled="true"]')){e.preventDefault();return;}
  var d=t.dataset;
  if(d.course){ui.course=d.course;ui.step=1;ui.agreed=false;render();setTimeout(function(){var x=document.getElementById('close-sheet');if(x)x.focus();},0);return;}
  switch(t.id){
    case 'close-sheet': case 'close-done': ui.course=null;render();return;
    case 'to-terms': ui.step=2;render();return;
    case 'back-1': ui.step=1;render();return;
    case 'to-form': if(ui.agreed){ui.step=3;render();}return;
    case 'back-2': ui.step=2;render();return;
    case 'to-done':
      var m=ui.mobile.replace(/\D/g,''),er=document.getElementById('reg-err');
      if(ui.name.trim().length<3){er.textContent='اكتب اسمك الكامل.';return;}
      if(m.length<8){er.textContent='اكتب رقم هاتف صحيح من 8 أرقام على الأقل.';return;}
      ui.ref=newRef();ui.step=4;render();return;
    case 'copy':
      var out=document.getElementById('copied');
      try{navigator.clipboard.writeText(S.profile.phone).then(function(){out.textContent='تم نسخ الرقم';},sel);}catch(x){sel();}
      function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('phone'));var s=getSelection();s.removeAllRanges();s.addRange(r);out.textContent='الرقم محدد، انسخه من جهازك';}
      return;
    case 'open-admin': ui.admin=true;ui.course=null;render();return;
    case 'close-admin': ui.admin=false;if(location.hash==='#admin')history.replaceState(null,'',location.pathname);render();return;
    case 'publish': publish();return;
    case 'close-login': ui.login=false;ui.loginErr='';if(location.hash==='#admin')history.replaceState(null,'',location.pathname);render();return;
    case 'logout': sb.auth.signOut().then(function(){canEdit=false;ui.admin=false;if(location.hash==='#admin')history.replaceState(null,'',location.pathname);render();});return;
    case 'new-course':
      var id='c'+Date.now().toString(36);
      S.courses.push({id:id,cat:'training',type:(S.types[0]||{}).id||'',title:'دورة جديدة',en:'',summary:'',details:'',price:'',duration:'',dates:'',place:'',terms:'',hidden:true});
      ui.editing=id;markDirty();render();return;
    case 'back-list': ui.editing=null;render();return;
  }
  if(d.type){ui.type=d.type;render();return;}
  if(d.delType){if(S.courses.some(function(c){return c.type===d.delType;})){ui.delAsk='type:'+d.delType;render();return;} d={reallyType:d.delType};}
  if(d.reallyType){var rid=d.reallyType;S.types=S.types.filter(function(x){return x.id!==rid;});S.courses.forEach(function(c){if(c.type===rid)c.type='';});if(ui.type===rid)ui.type='all';ui.delAsk=null;markDirty();render();return;}
  if(t.id==='add-type'){S.types.push({id:'t'+Date.now().toString(36),name:'نوع جديد'});markDirty();render();return;}
  if(d.tab){ui.tab=d.tab;ui.editing=null;ui.delAsk=null;render();return;}
  if(d.edit){ui.editing=d.edit;render();return;}
  if(d.toggle){var c=findCourse(d.toggle);c.hidden=!c.hidden;markDirty();render();return;}
  if(d.askDel){ui.delAsk=d.askDel;render();return;}
  if(d.cancelDel){ui.delAsk=null;render();return;}
  if(d.really){S.courses=S.courses.filter(function(c){return c.id!==d.really;});ui.delAsk=null;markDirty();render();return;}
  if(d.add){S[d.add].push(d.add==='stats'?{num:'',text:''}:'');markDirty();render();return;}
  if(d.del){var k=d.del.split('.');S[k[0]].splice(+k[1],1);markDirty();render();return;}
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);markDirty();return;}
  if(t.id==='reg-name')ui.name=t.value; else if(t.id==='reg-mobile')ui.mobile=t.value; else if(t.id==='reg-note')ui.note=t.value;
  if(t.id==='cc-paste')parsePasted(t.value);
  if(t.id&&t.id.indexOf('cc-')===0)confirmLink();
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='agree'){ui.agreed=t.checked;var b=document.getElementById('to-form');if(b)b.disabled=!t.checked;return;}
  if(t.id==='cc-course'){confirmLink();return;}
  if(t.tagName==='SELECT'&&t.dataset.bind){setPath(t.dataset.bind,t.value);markDirty();return;}
  if(t.id==='photo-file'&&t.files&&t.files[0]){
    ui.status='جارٍ تجهيز الصورة…';render();
    resizeImage(t.files[0],function(u){if(u){S.profile.photo=u;markDirty();ui.status='تم تغيير الصورة، اضغطي حفظ التعديلات';}else ui.status='تعذّر قراءة الصورة، جرّبي صورة JPG أو PNG.';render();});
  }
});
app.addEventListener('click',function(e){if(e.target.id==='overlay'){ui.course=null;render();}});
app.addEventListener('submit',function(e){
  if(e.target.id!=='login-form') return; e.preventDefault();
  var em=document.getElementById('lg-email').value.trim(), pw=document.getElementById('lg-pass').value;
  if(!em||!pw){ui.loginErr='اكتبي الإيميل وكلمة السر.';render();return;}
  ui.busy=true;ui.loginErr='';render();
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    if(r.error){ui.busy=false;ui.loginErr='الإيميل أو كلمة السر غير صحيحة.';render();return;}
    checkAdmin().then(function(ok){ui.busy=false;
      if(!ok){sb.auth.signOut();ui.loginErr='هذا الحساب ليس له صلاحية إدارة الموقع.';render();return;}
      canEdit=true;ui.login=false;ui.admin=true;render();});
  });
});
window.addEventListener('hashchange',function(){if(location.hash==='#admin')openLogin();});
window.addEventListener('beforeunload',function(e){if(ui.dirty){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.course){ui.course=null;render();}});

function boot(){
  if(!sb){loaded=true;render();return;}
  var done=false, timer=setTimeout(function(){if(!done){done=true;loaded=true;render();}},8000);
  sb.from('site_content').select('data').eq('id',1).maybeSingle().then(function(r){
    if(done) return; done=true; clearTimeout(timer);
    if(r.data&&r.data.data){var d=r.data.data;for(var k in S) if(!(k in d)) d[k]=S[k]; S=d; if(!S.types)S.types=[];}
    loaded=true;render();
    checkAdmin().then(function(ok){canEdit=ok;if(location.hash==='#admin')openLogin();else render();});
  });
}
render();boot();
})();
</script>
</body>
</html>
